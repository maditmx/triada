[package]
name = "triada"
version = "0.1.0"
edition = "2021"

[lib]
name = "triada"
path = "src/lib.rs"

[[bin]]
name = "triada"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
opt-level = 2
